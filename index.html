<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09101f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>CPC Trainer</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09101f;color:#fff;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#111a2c;border:1px solid #34405a;border-radius:24px;padding:24px;box-shadow:0 16px 60px #0008}
h1{margin:0 0 8px;font-size:30px}p{color:#b9c3d8;line-height:1.5}label{display:block;margin:18px 0 8px;font-weight:700}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #46526d;background:#07101f;color:#fff;font-size:17px}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:17px;background:#fff;color:#09101f}
.row{display:flex;gap:10px;align-items:center;margin-top:14px;color:#b9c3d8}.row input{width:auto}#status{min-height:24px;margin-top:14px;color:#c9d5ef;font-size:14px}.bad{color:#ffb4b4!important}
</style>
</head>
<body>
<main class="card">
<h1>CPC Trainer</h1>
<p>This device needs to unlock the private app package once. After a successful unlock, it can remember access on this device and work offline.</p>
<label for="pw">Access key</label><input id="pw" type="password" autocomplete="current-password" spellcheck="false">
<label class="row"><input id="remember" type="checkbox" checked> Remember on this device</label>
<button id="open">Open CPC Trainer</button><div id="status"></div>
</main>
<script>
const $=s=>document.querySelector(s), status=$('#status'), pw=$('#pw'), remember=$('#remember');
function b64bytes(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(pass){
 status.className='';status.textContent='Loading secure app…';
 const cfg=await fetch('./payload-config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing app configuration');return r.json()});
 const parts=[];for(let i=0;i<cfg.chunks;i++){const r=await fetch(`./payload/chunk-${String(i).padStart(3,'0')}.txt`);if(!r.ok)throw new Error('Missing app package part '+(i+1));parts.push(await r.text());status.textContent=`Loading secure app… ${i+1}/${cfg.chunks}`;}
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(cfg.salt),iterations:cfg.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 let compressed;try{compressed=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(cfg.nonce),additionalData:new TextEncoder().encode(cfg.aad)},key,b64bytes(parts.join(''))));}catch(e){throw new Error('Incorrect access key')}
 if(typeof DecompressionStream!=='function')throw new Error('This iPhone needs a newer Safari/iOS version for offline decompression.');
 const ds=new DecompressionStream('gzip');const stream=new Blob([compressed]).stream().pipeThrough(ds);const html=await new Response(stream).text();
 if(remember.checked)localStorage.setItem('cpc_unlock_key',pass);else localStorage.removeItem('cpc_unlock_key');
 status.textContent='Opening…';document.open();document.write(html);document.close();
}
$('#open').addEventListener('click',()=>unlock(pw.value).catch(e=>{status.className='bad';status.textContent=e.message}));
pw.addEventListener('keydown',e=>{if(e.key==='Enter')$('#open').click()});
const saved=localStorage.getItem('cpc_unlock_key');if(saved){pw.value=saved;unlock(saved).catch(()=>localStorage.removeItem('cpc_unlock_key'));}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
